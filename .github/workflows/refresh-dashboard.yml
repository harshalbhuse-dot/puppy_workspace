name: Refresh Mapbox Dashboard

on:
  schedule:
    # Runs daily at 08:00 UTC — adjust to ~1hr after your BQ job finishes
    - cron: '0 8 * * *'
  workflow_dispatch:   # also lets you trigger manually from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to commit & push the updated HTML

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r refresh/requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Generate updated dashboard HTML
        run: python refresh/generate_report.py

      - name: Commit & push if HTML changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/mapbox_report.html
          # only commit if something actually changed
          if git diff --cached --quiet; then
            echo "No changes to dashboard — BQ data unchanged since last run."
          else
            git commit -m "chore: auto-refresh Mapbox dashboard [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
          fi
